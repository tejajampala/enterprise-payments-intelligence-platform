resources:
  alerts:
    epip_pipeline_failure:
      display_name: "EPIP - Pipeline Failure"
      custom_description: "Triggers when a current EPIP pipeline has a FAILED latest update."
      warehouse_id: ${var.sql_warehouse_id}
      query_text: >-
        SELECT alert_count
        FROM ${var.catalog_name}.monitoring.operations_alert_candidates
        WHERE alert_type = 'PIPELINE_FAILURE'
      evaluation:
        comparison_operator: GREATER_THAN
        empty_result_state: OK
        source:
          name: alert_count
        threshold:
          value:
            double_value: 0
      schedule:
        pause_status: PAUSED
        quartz_cron_schedule: "0 0 * * * ?"
        timezone_id: "Australia/Melbourne"

    epip_data_freshness:
