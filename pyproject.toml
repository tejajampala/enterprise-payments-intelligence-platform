[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-payments-intelligence-platform"
version = "0.1.0"
description = "Enterprise Databricks payments data, ML, MLOps and GenAI platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-msk-iam-sasl-signer-python>=1.0.2,<2",
    "botocore[crt]>=1.43.78",
    "confluent-kafka>=2.12,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "mypy>=1.10",
    "mlflow[databricks]==3.15.2",
    "databricks-sdk==0.133.0",
    "databricks-sql-connector==4.4.0",
    "databricks-ai-search==0.78",
    "anthropic==0.121.0",
    "openai==3.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/payments_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
builtins = ["dbutils", "display"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
