bundle:
  name: enterprise-payments-intelligence-platform

  databricks_cli_version: ">= 1.3.0"

  engine: direct

variables:
  catalog_name:
    description: Existing Unity Catalog catalog for the payments platform.
    default: payments_dev

  s3_landing_url:
    description: AWS S3 landing URL governed by the Unity Catalog external location.

  storage_credential_name:
    description: Existing Unity Catalog storage credential for AWS S3.
    default: payments_s3_dev

  msk_bootstrap_servers:
    description: Public SASL/IAM Amazon MSK bootstrap broker endpoints.

  msk_topic:
    description: Kafka topic containing payment events.
    default: payments.events.v1

  msk_service_credential_name:
    description: Unity Catalog service credential used by Databricks to access Amazon MSK.
    default: payments_msk_dev

  rag_generation_provider_model:
    default: claude-sonnet-4-6

  rag_judge_provider_model:
    default: gpt-4o

  rag_secret_scope:
    default: epip_llm_secrets
  
  rag_classic_job_policy_id:
    description: Classic Databricks Job Compute policy used for BYOK RAG evaluation.
    default: 000ECC4A882DCB1D

experimental:
  skip_name_prefix_for_schema: true

include:
  - bundle.targets.yml
  - bundle/resources/*.yml

sync:
  exclude:
    - .git/**
    - .github/**
    - .venv/**
    - .pytest_cache/**
    - .ruff_cache/**
    - .mypy_cache/**
    - tests/**
    - infra/**
    - docs/**
    - data/**
    - .env
    - "**/__pycache__/**"