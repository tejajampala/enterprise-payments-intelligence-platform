bundle:
  name: enterprise-payments-intelligence-platform

  # Keep local and CI/CD deployments on a modern CLI version.
  databricks_cli_version: ">= 1.3.0"

  # Use the Databricks-native direct deployment engine.
  engine: direct

variables:
  catalog_name:
    description: Existing Unity Catalog catalog for the payments platform.
    default: payments_dev

experimental:
  # Keep Unity Catalog schema names stable in development mode.
  # Otherwise Databricks prefixes schemas with the developer identity.
  skip_name_prefix_for_schema: true

include:
  - bundle.targets.yml
  - bundle/resources/*.yml

sync:
  exclude:
    - .git/**
    - .github/**
    - .venv/**
    - .pytest_cache/**
    - .ruff_cache/**
    - .mypy_cache/**
    - tests/**
    - infra/**
    - docs/**
    - data/**
    - .env
    - "**/__pycache__/**"